services:
  postgres:
    image: postgres:16-alpine
    container_name: nglms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nglms
      POSTGRES_PASSWORD: nglms
      POSTGRES_DB: nglms
    ports:
      # Host 5435 avoids conflict with local Postgres services
      - "5435:5432"
    volumes:
      - nglms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nglms -d nglms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nglms_pgdata:
